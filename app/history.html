<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your runs · Zuvori</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="tracker">
    <div class="app-bar">
      <a class="back" href="index.html">← Tracker</a>
    </div>

    <section class="panel">
      <h1 id="greeting">Your runs</h1>
      <form id="name-form" class="name-form">
        <label for="display-name" class="sr-only">Display name</label>
        <input type="text" id="display-name" placeholder="Display name" maxlength="30">
        <button type="submit" class="btn">Save</button>
      </form>
      <p id="name-note" class="note"></p>

      <div class="stats">
        <div><span id="total-sessions">0</span><small>sessions</small></div>
        <div><span id="total-km">0.0</span><small>total km</small></div>
      </div>
    </section>

    <section class="panel progress-panel">
      <h2>This week</h2>
      <div id="week" class="week"></div>
      <p id="streak" class="streak"></p>
      <p class="note">Rest days are part of the plan. Your streak only breaks after 3 days off in a row.</p>
    </section>

    <section class="panel hist-panel">
      <h2>History</h2>
      <ul id="history" class="hist"></ul>
      <p id="empty" class="note" hidden>No runs yet. Go move, then come back.</p>
    </section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <a href="index.html" class="tab">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
      <span>Run</span>
    </a>
    <a href="history.html" class="tab active" aria-current="page">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Progress</span>
    </a>
    <a href="me.html" class="tab">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      <span>Me</span>
    </a>
  </nav>



  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="history.js"></script>
</body>
</html>
